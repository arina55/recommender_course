name: Deployment CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker compose build
      - name: Compile Python and test recommendations
        run: |
          docker run --rm recommender-app python -c "from pathlib import Path; compile(Path('app.py').read_text(encoding='utf-8'), 'app.py', 'exec')"
          docker run --rm --mount "type=bind,source=$PWD/tests,target=/tests,readonly" recommender-app python /tests/smoke.py
      - name: Start Streamlit and check HTTP health
        run: |
          docker compose up -d --wait --wait-timeout 60
          curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down
